# Allow selected dependencies to run their install/build scripts (pnpm blocks
# package build scripts by default).
#   - esbuild  → Vite's native binary
#   - workerd  → the Cloudflare Workers runtime used by `wrangler dev`
#   - sharp    → image tooling pulled in by wrangler
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
