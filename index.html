<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>%META_TITLE%</title>
    <meta name="description" content="%META_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Open Graph: link previews in Discord / WhatsApp / Facebook / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%GAME_NAME%" />
    <meta property="og:title" content="%META_TITLE%" />
    <meta property="og:description" content="%META_SOCIAL%" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/screenshot.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%META_IMAGE_ALT%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <!-- X / Twitter card (image URL absolutised by the Worker, same as og:image) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%META_TITLE%" />
    <meta name="twitter:description" content="%META_SOCIAL%" />
    <meta name="twitter:image" content="/screenshot.jpg" />
    <!-- Run full-screen (no browser chrome) when added to the home screen; on iOS the
       black-translucent status bar lets the game fill under it (with safe-area insets). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%GAME_NAME%" />
    <meta name="theme-color" content="#10141a" />
    <!-- PWA install: landscape-locked, fullscreen display (Android honours these; iOS uses
         the apple-* meta above). Add to Home Screen for the real fullscreen experience. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #10141a;
      }
    </style>
  </head>
  <body>
    <!-- Pixi mounts its canvas here -->
    <div id="game-container"></div>
    <!-- Preact renders the HUD / screens here (overlays the canvas) -->
    <div id="ui-root"></div>
    <noscript>
      <style>
        #no-js {
          padding: 48px 24px;
          text-align: center;
          font-family: 'Segoe UI', Arial, sans-serif;
          color: #8fa6bd;
        }
        #no-js h1 {
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #eef2f6;
        }
        #no-js p {
          max-width: 62ch;
          margin: 16px auto 0;
          line-height: 1.55;
        }
      </style>
      <div id="no-js">
        <h1>%GAME_NAME%</h1>
        <p>%NOSCRIPT_PITCH%</p>
        <p>%NOSCRIPT_REQUIRES%</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
