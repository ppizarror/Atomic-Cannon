<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Atomic Cannon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    /* Full-viewport stage; the Pixi canvas fills it and the HUD floats on top. */
    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    #game-container canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    /* HUD overlays sit above the Pixi canvas */
    #status-bar, #turn-indicator, #ui-layer { z-index: 10; }

    /* ---- HUD overlays (HTML, layered above the canvas) ---- */
    #status-bar {
      position: absolute;
      top: clamp(6px, 1.2vh, 14px);
      left: clamp(6px, 1vw, 16px);
      right: clamp(6px, 1vw, 16px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      font-size: clamp(11px, 1.4vw, 14px);
      pointer-events: none;
    }
    .player-info {
      background: rgba(0,0,0,0.55);
      padding: 8px 15px;
      border-radius: 5px;
    }
    .tank-health { display: flex; gap: 10px; align-items: center; }
    .health-bar {
      width: clamp(60px, 8vw, 90px);
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .health-fill { height: 100%; transition: width 0.3s; }
    .life-fill { background: linear-gradient(to right, #f00, #ff4444); }
    .shield-fill { background: linear-gradient(to right, #00f, #44f); }

    #turn-indicator {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 4vw, 40px);
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,200,0,0.85);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #turn-indicator.visible { opacity: 1; }

    /* Bottom control bar */
    #ui-layer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      min-height: 96px;
      background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.55) 70%, transparent);
      padding: 14px clamp(12px, 3vw, 40px);
      display: flex;
      align-items: center;
      gap: clamp(14px, 3vw, 40px);
      flex-wrap: wrap;
    }
    .control-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .control-label { font-size: 12px; color: #9aa; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type="range"] { width: clamp(110px, 16vw, 180px); height: 20px; cursor: pointer; }
    .control-value { font-size: 14px; font-weight: bold; color: #4f4; }

    #fire-btn {
      background: linear-gradient(to bottom, #ff4444, #cc0000);
      border: none; color: #fff;
      padding: 14px clamp(24px, 4vw, 46px);
      font-size: clamp(15px, 2vw, 19px);
      font-weight: bold; cursor: pointer;
      border-radius: 8px; text-transform: uppercase;
      box-shadow: 0 4px #900; transition: all 0.1s;
    }
    #fire-btn:hover { background: linear-gradient(to bottom, #ff6666, #ee0000); }
    #fire-btn:active { transform: translateY(2px); box-shadow: 0 2px #600; }
    #fire-btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Pixi renders here; the HUD elements below sit on top -->

    <div id="status-bar">
      <div class="player-info" id="current-player">Player 1 - Tank 1</div>
      <div class="player-info tank-health">
        <span>Life:</span><div class="health-bar"><div class="health-fill life-fill" id="life-fill" style="width:100%"></div></div>
        <span>Shield:</span><div class="health-bar"><div class="health-fill shield-fill" id="shield-fill" style="width:50%"></div></div>
      </div>
    </div>

    <div id="turn-indicator">Player 1's Turn</div>

    <div id="ui-layer">
      <div class="control-group">
        <span class="control-label">Angle</span>
        <input type="range" id="angle-slider" min="0" max="180" value="45" />
        <span class="control-value"><span id="angle-value">45</span>°</span>
      </div>

      <div class="control-group">
        <span class="control-label">Power</span>
        <input type="range" id="power-slider" min="10" max="100" value="50" />
        <span class="control-value"><span id="power-value">50</span>%</span>
      </div>

      <div class="control-group">
        <button id="fire-btn">FIRE!</button>
      </div>

      <div class="control-group" style="margin-left: auto;">
        <span class="control-label">Wind</span>
        <span class="control-value" id="wind-value">→ 5</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
